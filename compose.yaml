services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=csa'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d csa"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: [full]
    build: .
    ports:
      - '18080:18080'
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_PORT=18080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/csa
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - CSA_USER_JWT_SECRET=${CSA_USER_JWT_SECRET:?CSA_USER_JWT_SECRET is required}
      - SPRING_DOCKER_COMPOSE_LIFECYCLE-MANAGEMENT=none
      - CSA_MEDIA_STORAGE_MODE=local
      - CSA_MEDIA_STORAGE_ROOT=/app/uploads
      - CSA_MEDIA_PUBLIC_BASE_URL=http://localhost:18080/uploads
      - CSA_CLAMAV_HOST=clamav
      - CSA_CLAMAV_PORT=3310
      - CSA_CLAMAV_CONNECT_TIMEOUT_MS=5000
      - CSA_CLAMAV_READ_TIMEOUT_MS=5000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  clamav:
    image: 'clamav/clamav:1.5.3'
    environment:
      - CLAMD_CONF_StreamMaxLength=525M
      - CLAMD_CONF_MaxFileSize=525M
      - CLAMD_CONF_MaxScanSize=525M
    ports:
      - '127.0.0.1:13310:3310'

volumes:
  postgres_data:
