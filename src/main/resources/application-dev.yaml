spring:
  datasource:
    url: jdbc:postgresql://dev-db-host:5432/csa
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: front
  flyway:
    enabled: true
    schemas: front
    default-schema: front
    create-schemas: true

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtb25seS0yNTZiaXQhIQ==
  access-expiration: 86400000
  refresh-expiration: 604800000

server:
  port: 8080

logging:
  level:
    root: INFO
    org.example.csa_backend: INFO

google:
  oauth:
    client-id: ""

ai:
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
    base-url: https://api.anthropic.com
  dalle:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    base-url: https://api.elevenlabs.io
    voice-ids:
      dad: ${ELEVENLABS_VOICE_DAD:}
      mom: ${ELEVENLABS_VOICE_MOM:}
      grandma: ${ELEVENLABS_VOICE_GRANDMA:}
      grandpa: ${ELEVENLABS_VOICE_GRANDPA:}

storage:
  mode: local
  local-base-path: C:/project/csa/generated-fairytales
  server-base-url: ${DEV_SERVER_BASE_URL:http://localhost:8080}

csa:
  media:
    storage-mode: ${CSA_MEDIA_STORAGE_MODE}
    storage-root: ${CSA_MEDIA_STORAGE_ROOT}
    bucket: ${CSA_MEDIA_BUCKET}
    prefix: ${CSA_MEDIA_PREFIX}
    public-base-url: ${CSA_MEDIA_PUBLIC_BASE_URL}
    ffprobe-path: ${CSA_MEDIA_FFPROBE_PATH}
    probe-timeout-ms: ${CSA_MEDIA_PROBE_TIMEOUT_MS}
    clamav:
      host: ${CSA_CLAMAV_HOST}
      port: ${CSA_CLAMAV_PORT}
      connect-timeout-ms: ${CSA_CLAMAV_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${CSA_CLAMAV_READ_TIMEOUT_MS}
