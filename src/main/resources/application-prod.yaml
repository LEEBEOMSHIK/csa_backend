spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/csa
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: front
  flyway:
    enabled: true
    schemas: front
    default-schema: front
    create-schemas: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 86400000
  refresh-expiration: 604800000

server:
  port: 8080

logging:
  level:
    root: WARN
    org.example.csa_backend: INFO

google:
  oauth:
    client-id: ""

features:
  ai-generation:
    enabled: ${AI_GENERATION_ENABLED:false}

store:
  apple:
    bundle-id: ${APP_STORE_BUNDLE_ID:}
    issuer-id: ${APP_STORE_ISSUER_ID:}
    key-id: ${APP_STORE_KEY_ID:}
    private-key: ${APP_STORE_PRIVATE_KEY:}
    environment: ${APP_STORE_ENVIRONMENT:Production}
    server-base-url: ${APP_STORE_SERVER_BASE_URL:https://api.storekit.itunes.apple.com}
    root-certificates: ${APP_STORE_ROOT_CERTIFICATES:}
  google:
    pubsub-oidc:
      audience: ${PUBSUB_OIDC_AUDIENCE:}
      service-account-email: ${PUBSUB_OIDC_SERVICE_ACCOUNT_EMAIL:}

ai:
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
    base-url: https://api.anthropic.com
  dalle:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    base-url: https://api.elevenlabs.io
    voice-ids:
      dad: ${ELEVENLABS_VOICE_DAD:}
      mom: ${ELEVENLABS_VOICE_MOM:}
      grandma: ${ELEVENLABS_VOICE_GRANDMA:}
      grandpa: ${ELEVENLABS_VOICE_GRANDPA:}

storage:
  mode: cdn
  cdn-base-url: ${CDN_BASE_URL}
  server-base-url: ${SERVER_BASE_URL}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: ${S3_PATH_STYLE:true}
